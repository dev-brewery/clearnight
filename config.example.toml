# clearnight example config — committed, safe defaults.
# Site-specific overrides and secrets go in config.local.toml (gitignored).

[site]
name = "Black Mesa State Park (demo)"
lat = 36.85
lon = -102.88
elevation_m = 1450
tz = "America/Chicago"

nights = 7
cache_dir = "cache"
out_dir = "out"

[sensor]
kind = "csv"
path = "clearnight/fixtures/sensor.csv"

# HTTP sensor alternative (maps JSON response keys to Reading fields):
# [sensor]
# kind = "http_json"
# url = "http://homeassistant.local:8123/api/states/sensor.example"
# field_map = { temperature = "temperature_c", humidity = "humidity_pct", pressure = "pressure_hpa", dew_point = "dew_point_c" }
# timeout_s = 10
# PoC pattern (T28): point url at a local HA-shaped JSON file (no server, no auth):
# url = "file://<repo>/clearnight/fixtures/mock_ha_sensor.json"
# The committed fixture mirrors the HA states API shape; the adapter does not care
# where the JSON lives. The runtime twin of this pattern is out/mock_sensor.json
# (gitignored) holding real Thursday-night values in the same shape.
# Auth headers if the endpoint needs them (config.local.toml ONLY, never commit):
# [sensor.headers]
# Authorization = "Bearer <long-lived token - config.local.toml ONLY, never commit>"

# Real endpoints live in .env or config.local.toml (both gitignored) - NEVER in
# committed files. Env vars override TOML: CLEARNIGHT_LLM_BASE_URL,
# CLEARNIGHT_LLM_MODEL, CLEARNIGHT_LLM_API_KEY, CLEARNIGHT_SENSOR_URL.
# See .env.example. The default below is a safe inert placeholder; the online
# plan against it simply uses the labeled template brief (by design).
[llm]
base_url = "http://localhost:8080/v1"
model = "/models/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q6_K.gguf"
# local 27B reasoning models need minutes for a 2000-token budget - 30s was measured too short live (Oct 8); fast hosted endpoints can lower this
timeout_s = 300
# Reasoning models spend tokens on thinking before the answer; 400 strangled Qwen3.8 - measured live Oct 8
max_tokens = 2000

# OWNER DIRECTIVE (T25): GLM models on z.ai run reasoning by default and can
# burn the token budget before answering; thinking level low keeps briefs
# fast and non-empty. Harmless on endpoints that ignore the field (llama.cpp
# does). Merged into the chat/completions request body; extra_body keys win
# over the defaults.
[llm.extra_body]
thinking = { type = "enabled", level = "low" }

# api_key lives ONLY in config.local.toml — never commit it to this file.
# api_key = "sk-..."
