# clearnight example config — committed, safe defaults.
# Site-specific overrides and secrets go in config.local.toml (gitignored).

[site]
name = "Black Mesa State Park (demo)"
lat = 36.85
lon = -102.88
elevation_m = 1450
tz = "America/Chicago"

nights = 7
cache_dir = "cache"
out_dir = "out"

[sensor]
kind = "csv"
path = "clearnight/fixtures/sensor.csv"

# HTTP sensor alternative (maps JSON response keys to Reading fields):
# [sensor]
# kind = "http_json"
# url = "http://your-station/api/latest"
# field_map = { temperature = "temperature_c", humidity = "humidity_pct", pressure = "pressure_hpa", dew_point = "dew_point_c" }
# timeout_s = 10

[llm]
base_url = "http://llmbox.internal:8080/v1"
model = "qwen3.8-27b"
timeout_s = 30
# api_key lives ONLY in config.local.toml — never commit it to this file.
# api_key = "sk-..."
